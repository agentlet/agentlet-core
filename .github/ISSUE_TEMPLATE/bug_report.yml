name: Bug report
description: Something in agentlet-core does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security problems, do not use this form: use the [security advisory form](https://github.com/agentlet/agentlet-core/security/advisories/new).
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest page or snippet that shows the problem is the most useful.
      placeholder: |
        1. Load agentlet-core with ...
        2. Register a module with ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How is agentlet-core loaded
      options:
        - Bookmarklet
        - Browser extension
        - Embedded in the app (script tag or bundler)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agentlet-core version
      description: For example 2.2.0, from `npm ls agentlet-core` or the CDN URL.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 130 on macOS 14
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Paste errors from the browser console. Remove any API keys or customer data first.
