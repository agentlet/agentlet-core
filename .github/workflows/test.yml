name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    # The Playwright e2e suite alone budgets up to 45 minutes on CI (see
    # .github/WORKFLOWS.md), so give the whole job enough headroom above
    # that for npm ci / jest / build / browser install.
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Jest tests
      run: npm test

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Build project
      run: npm run build
      
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      run: npm run test:examples
      
    - name: Upload test artifacts on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-artifacts
        path: |
          tests/examples/test-results/
        retention-days: 3