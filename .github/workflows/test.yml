name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    # npm ci / jest / lint / typecheck / build together run in well under a
    # minute on a green run; this leaves generous headroom without hiding a
    # hang.
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Jest tests
      run: npm test

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Build project
      run: npm run build

  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    # One browser project is roughly a third of the full e2e suite. The
    # config's own globalTimeout budgets 20 minutes per project (see
    # .github/WORKFLOWS.md); this gives extra room above that for checkout,
    # npm ci and the browser install.
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Read the Playwright version
      id: playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    # Browser downloads are occasionally very slow on hosted runners, enough
    # to push the job past timeout-minutes. The cache key changes with the
    # Playwright version, so an upgrade downloads the matching browser once.
    - name: Cache Playwright browser (${{ matrix.project }})
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.project }}

    - name: Install Playwright browser (${{ matrix.project }})
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps ${{ matrix.project }}

    # The cache holds the browser only. Its system libraries still come from
    # apt on every run.
    - name: Install Playwright system dependencies (${{ matrix.project }})
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps ${{ matrix.project }}

    - name: Run Playwright tests (${{ matrix.project }})
      run: npm run test:examples -- --project=${{ matrix.project }}

    - name: Upload test artifacts on failure
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: test-artifacts-${{ matrix.project }}
        path: |
          tests/examples/test-results/
        retention-days: 3
