name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify-tag:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check the tag matches the package version
      # An npm version is immutable once published. Pushing tag v2.0.1 while
      # package.json still says 2.0.0 would silently publish 2.0.0, or fail
      # with a confusing error if that version already exists. Fail early and
      # say which is which instead.
      run: |
        tag_version="${GITHUB_REF_NAME#v}"
        pkg_version="$(node -p 'require("./package.json").version')"
        if [ "$tag_version" != "$pkg_version" ]; then
          echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}." >&2
          echo "Bump the version in package.json and retag, or push the matching tag." >&2
          exit 1
        fi
        echo "Tag ${GITHUB_REF_NAME} matches package.json version ${pkg_version}."

  # The same jobs as test.yml (Jest, lint, type check, build, and the e2e
  # suite on chromium, firefox and webkit), run on the tagged commit. The
  # release job below needs them, so a tag on a bad commit cannot publish.
  # Starts only once the tag is known to match package.json, so a mistyped
  # tag fails in seconds instead of after the e2e suite.
  checks:
    name: checks
    needs: verify-tag
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  release:
    needs: [verify-tag, checks]
    runs-on: ubuntu-latest
    # npm ci, jest and build again for the publish itself (the checks job
    # above is a separate runner), plus the SBOM, the scan and the npm
    # publish. The e2e suite runs in the checks job, not here.
    timeout-minutes: 20

    # id-token: write lets npm authenticate to the registry with a short-lived
    # OIDC token (npm trusted publishing, no NPM_TOKEN secret) and attest
    # where the package was built (provenance). contents: write is needed to
    # create/attach to the GitHub release for this tag (see "Attach SBOM to
    # the GitHub release" below) - the nightly job in security.yml reads
    # that asset back to rescan already-published versions against newly
    # disclosed CVEs.
    permissions:
      id-token: write
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Use Node.js 22.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.x
        cache: 'npm'
        # Required by npm trusted publishing: it points npm at the registry
        # that has the trusted publisher configured.
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Run Jest tests
      run: npm test

    - name: Build project
      run: npm run build

    - name: Generate shipped-inventory SBOM
      # Generated before publish so a failure here stops before anything is
      # published - see "Attach SBOM to the GitHub release" for why the
      # upload itself happens after publish instead.
      id: sbom
      uses: agentlet/.github/actions/sbom-from-esbuild@13f8b012ab7b0e07229389ac7538bdab38cdb4e6 # dependency-scan-v1
      with:
        metafiles: |
          reports/security/meta/agentlet-core.meta.json
          reports/security/meta/agentlet-core.min.meta.json
          reports/security/meta/agentlet-core.full.min.meta.json
          reports/security/meta/chunks.meta.json
          reports/security/meta/agentlet-core.esm.meta.json
          reports/security/meta/bookmarklet.meta.json
          reports/security/meta/extension.meta.json
        output: reports/security/sbom-bundle.cdx.json

    - name: Scan the SBOM before publishing
      # A release must not ship a blocking vulnerability: the gate fails the
      # job here, before npm publish. No SARIF upload (this job has no
      # security-events permission and main's scan already owns the alerts).
      uses: agentlet/.github/actions/dependency-scan@13f8b012ab7b0e07229389ac7538bdab38cdb4e6 # dependency-scan-v1
      with:
        blocking-sbom: ${{ steps.sbom.outputs.sbom-path }}
        lockfile: ''
        upload-sarif: 'false'
        artifact-name: release-scan-reports
        fail-on-gate: 'true'

    - name: Upgrade npm for staged trusted publishing
      # Staged publishing needs npm 11.15.0 or later, trusted publishing
      # (OIDC) needs npm 11.5.1 or later, and both need Node 22.14.0 or later.
      # The npm bundled with Node 22 is older, so upgrade it here, right
      # before it is needed, and fail clearly if the result is too old.
      run: |
        npm install -g 'npm@^11.15.0'
        npm_version="$(npm --version)"
        echo "npm ${npm_version}, node $(node --version)"
        if [ "$(printf '%s\n' 11.15.0 "$npm_version" | sort -V | head -n 1)" != "11.15.0" ]; then
          echo "npm ${npm_version} is older than 11.15.0, staged publishing is not available." >&2
          exit 1
        fi

    - name: Stage the package on npm
      # No NODE_AUTH_TOKEN and no NPM_TOKEN: npm exchanges the job's OIDC
      # identity for a short-lived token, using the trusted publisher
      # configured on npmjs.com (organization agentlet, repository
      # agentlet-core, workflow release.yml). That trusted publisher may only
      # stage: the version becomes public once a maintainer approves it with
      # 2FA. --provenance stays so that staging fails instead of silently
      # going out without an attestation.
      run: |
        set -euo pipefail
        npm stage publish --provenance --access public | tee stage-output.txt
        {
          echo "### ${GITHUB_REF_NAME} is staged on npm, not yet public"
          echo
          echo "Approve it with 2FA on npmjs.com (package agentlet-core, Staged Packages tab),"
          echo "or with \`npm stage list agentlet-core\` then \`npm stage approve <stage-id>\`."
          echo
          echo '```'
          cat stage-output.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Attach SBOM to the GitHub release
      # Runs after the package is staged: if creating/uploading to the
      # GitHub release fails, the package is already staged (the
      # important, hard-to-undo step) and this step can simply be re-run
      # (gh release upload --clobber) without staging it again. The GitHub
      # release can therefore appear before the npm version is approved.
      # security.yml's nightly job downloads this asset to rescan the
      # published version against newly disclosed CVEs.
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          gh release upload "${GITHUB_REF_NAME}" reports/security/sbom-bundle.cdx.json --repo "${GITHUB_REPOSITORY}" --clobber
        else
          gh release create "${GITHUB_REF_NAME}" reports/security/sbom-bundle.cdx.json --repo "${GITHUB_REPOSITORY}" --generate-notes
        fi
