name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    # Same order of magnitude as test.yml (npm ci, jest, build), without the
    # Playwright e2e suite, plus headroom for the npm publish step itself.
    timeout-minutes: 20

    # npm publish --provenance needs to mint an OIDC token to attest where
    # the package was built (id-token: write), and needs to check out the
    # repository to build and publish it (contents: read). Without
    # id-token: write, `npm publish --provenance` fails outright.
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        # Required for NODE_AUTH_TOKEN to be picked up by npm publish.
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Run Jest tests
      run: npm test

    - name: Build project
      run: npm run build

    - name: Publish to npm
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
