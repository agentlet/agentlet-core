name: Security

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    # Nightly rescan: new CVEs/EPSS/KEV data can make an unchanged bundle
    # (including an already-published release, see the "nightly-release-scan"
    # job) newly non-compliant even without a code change.
    - cron: '17 3 * * *'
  workflow_dispatch: {}

# The scan logic lives in the shared actions of agentlet/.github, pinned by
# commit (the trailing comment is the tag). To change the osv-scanner
# version, use the action's `osv-scanner-version` input.

jobs:
  scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # issues: write is only exercised on the nightly schedule (the action's
    # issue-on-failure). security-events: write uploads the SARIF; the action
    # skips that upload itself on fork PRs, whose token is read-only.
    permissions:
      contents: read
      security-events: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        # Writes the esbuild metafiles under reports/security/meta/.
        run: npm run build

      - name: Generate shipped-inventory SBOM
        id: sbom
        uses: agentlet/.github/actions/sbom-from-esbuild@13f8b012ab7b0e07229389ac7538bdab38cdb4e6 # dependency-scan-v1
        with:
          metafiles: |
            reports/security/meta/agentlet-core.meta.json
            reports/security/meta/agentlet-core.min.meta.json
            reports/security/meta/agentlet-core.esm.meta.json
            reports/security/meta/bookmarklet.meta.json
            reports/security/meta/extension.meta.json

      - name: Run vulnerability scan and gate
        uses: agentlet/.github/actions/dependency-scan@13f8b012ab7b0e07229389ac7538bdab38cdb4e6 # dependency-scan-v1
        with:
          blocking-sbom: ${{ steps.sbom.outputs.sbom-path }}
          lockfile: package-lock.json
          sarif-category: dependency-vulnerabilities
          artifact-name: security-scan-reports
          issue-on-failure: ${{ github.event_name == 'schedule' }}
          issue-title: 'Nightly scan: main has a blocking vulnerability'

  nightly-release-scan:
    name: Rescan latest published release
    # Only meaningful on the nightly schedule (or a manual dispatch meant to
    # reproduce it): re-checks a version that already shipped against
    # vulnerabilities disclosed since it was published. A PR or a push to
    # main is already covered by the `scan` job above.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch latest release's SBOM asset, if published
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports/security
          latest_tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "${latest_tag}" ]; then
            echo "No published release found; skipping." >&2
            echo "has_sbom=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release download "${latest_tag}" --repo "${GITHUB_REPOSITORY}" --pattern 'sbom-bundle.cdx.json' --dir reports/security --clobber 2>/dev/null; then
            echo "tag=${latest_tag}" >> "$GITHUB_OUTPUT"
            echo "has_sbom=true" >> "$GITHUB_OUTPUT"
          else
            echo "Latest release ${latest_tag} has no sbom-bundle.cdx.json asset yet; skipping." >&2
            echo "has_sbom=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan the published release's SBOM
        if: steps.fetch.outputs.has_sbom == 'true'
        uses: agentlet/.github/actions/dependency-scan@13f8b012ab7b0e07229389ac7538bdab38cdb4e6 # dependency-scan-v1
        with:
          blocking-sbom: reports/security/sbom-bundle.cdx.json
          lockfile: ''
          # A past release's findings must not replace the code scanning
          # alerts of main (and this job has no security-events permission).
          upload-sarif: 'false'
          artifact-name: release-scan-reports
          fail-on-gate: 'true'
          issue-on-failure: 'true'
          issue-title: 'Nightly scan: published release ${{ steps.fetch.outputs.tag }} has a blocking vulnerability'
